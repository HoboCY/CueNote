name: Mac native acceptance kit

on:
  workflow_dispatch:
  push:
    branches: ['codex/project-foundation']
    paths: ['.github/workflows/macos-native-acceptance.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install locked build inputs
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup target add aarch64-apple-darwin --toolchain 1.99.0
          npm ci
      - name: Check owned harnesses and runner
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          bash -n tools/acceptance/native-macos/run-acceptance.command
      - name: Build isolated kit and encrypted delivery
        run: |
          npm run build
          npm run package:licenses
          node tools/acceptance/native-macos/build.mjs
      - name: Upload encrypted native acceptance kit only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CueNote-macos-native-acceptance-kit
          path: |
            package-output/native-acceptance-encrypted/*.age
            package-output/native-acceptance-encrypted/*.age.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
