[package]
name = "cuenote"
version = "0.1.0"
description = "CueNote desktop application"
authors = ["CueNote"]
edition = "2021"
default-run = "cuenote"

[lib]
name = "cuenote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Explicitly opt in for isolated fault-injection runs. Release code never reads
# these controls, even if this feature is accidentally enabled during a build.
storage-fault-injection = []
# Optimized acceptance runs use an explicit isolated root. Never enabled in packages.
perf-acceptance = ["dep:block2", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-web-kit"]

[[example]]
name = "storage_fault_probe"
required-features = ["storage-fault-injection"]

[[example]]
name = "backup_fault_probe"
required-features = ["storage-fault-injection"]

[[example]]
name = "backup_restore_fault_probe"
required-features = ["storage-fault-injection"]

[[example]]
name = "library_restore_fault_probe"
required-features = ["storage-fault-injection"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
uuid = { version = "=1.28.0", features = ["v4"] }
chrono = "=0.4.45"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
schemars = "=1.2.3"
ts-rs = "=12.0.1"
notify = "=8.2.0"

[dev-dependencies]
tempfile = "3"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# sha2 0.10 requires this feature for its CPU-selected ARM SHA-256 backend.
# Keep the same digest algorithm; other target configurations remain unchanged.
sha2 = { version = "=0.10.9", features = ["asm"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "=0.6.2", optional = true }
objc2 = { version = "=0.6.5", optional = true }
objc2-app-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSView", "NSWindow", "NSScreen", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSGeometry", "NSProcessInfo"] }
objc2-web-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKContentWorld", "WKFrameInfo", "block2"] }
