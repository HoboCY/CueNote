[package]
name = "cuenote-prototype"
version = "0.1.0"
description = "CueNote disposable Tauri 2 storage prototype"
edition = "2021"
default-run = "cuenote-prototype"
rust-version = "1.88"

[lib]
name = "cuenote_prototype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cuenote-prototype"
path = "src/main.rs"

[[bin]]
name = "storage_probe"
path = "src/bin/storage_probe.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2" }
zip = { version = "6", default-features = false, features = ["deflate"] }
